   <!-- Script for really cool Text Jumble Animation on button Hover-->
   <script>
      //query selector finds all <a> tag inside my navigation bar (it's actually finding the span tag inside each <a>, which is there for the underline animation),
      //the forEach loops through each one and sets up each animation   
    document.querySelectorAll('.navigationBar nav ul li a span').forEach(span => {
      let interval = null;
      //reads the data-value stored for each button and
      const originalText = span.dataset.value;
      //listen for mouse hover
      span.addEventListener('mouseenter', () => {
        let frameCount = 0;
        const totalJumbles = 3;  //number of frames for animation
        const speed = 80;       //animation speed (ms)

        clearInterval(interval); //stops any other animation timer that may be running if buttons were switched between quickly

        interval = setInterval(() => {
          if (frameCount < totalJumbles) {
            // Create a random anagram 
            const anagram = originalText.split('').sort(() => Math.random() - 0.5).join('');

            span.innerText = anagram;
            frameCount++;
          } else {
            // Restore original text
            span.innerText = originalText;
            clearInterval(interval);
          }
        }, speed);
      });
    });
  </script>

  <!-- Script for the lightswitch-->
  <script>
      const myImage = document.getElementById('lightswitch');

      // Define paths to your two images
      const on = './images/lightswitchON.png';
      const off = './images/lightswitchOFF.png';


      //I know I should've done this with a css class for dark and light mode but I will later lol
      const lightMode = 'radial-gradient(circle at 40% 50%, #ffffff, rgb(255, 255, 255))';
      const darkMode = 'radial-gradient(circle at 40% 50%, #999696, #1a1a1a';

      myImage.addEventListener('click', () => {
         // Check current source and toggle to the other image
         if (myImage.src.includes('lightswitchON.png')) {
            myImage.src = off;
            document.body.style.backgroundImage = darkMode;
         } else {
            myImage.src = on;
            document.body.style.backgroundImage = lightMode;
         }
      });
   </script>
